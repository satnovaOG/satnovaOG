<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Montealegre Romero</title>
  <desc id="desc">Systems Engineering student focused on applied AI: LLM pipelines, agentic systems and local inference.</desc>
  <style>
    .flow   { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    .pulse  { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.6s; }
    .spin   { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite reverse; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .glow   { animation: glow 4s ease-in-out infinite; }
    @keyframes flow  { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.35); opacity: 1; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 50% { fill-opacity: 1; } 50.01%, 100% { fill-opacity: 0; } }
    @keyframes glow  { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111821"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2a37"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f14" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0b0f14" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="760" height="300" fill="url(#fade)"/>
    <circle class="glow" cx="900" cy="150" r="140" fill="url(#halo)"/>

    <!-- agent graph: idle edges -->
    <g stroke="#2a3644" stroke-width="1.5" fill="none">
      <path d="M790 150 L900 150"/>
      <path d="M900 150 L990 228"/>
      <path d="M990 228 L1090 184"/>
      <path d="M1090 116 L1090 184"/>
      <path d="M1090 184 L1150 150"/>
    </g>
    <!-- active path: data flowing through the pipeline -->
    <g fill="none" stroke-width="2">
      <path class="flow" d="M900 150 L990 72 L1090 116 L1150 150" stroke="#34d399"/>
      <path class="flow" d="M790 150 L900 150" stroke="#67e8f9"/>
    </g>

    <!-- steel-ball orbit around the orchestrator node -->
    <circle class="spin" cx="900" cy="150" r="30" fill="none" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="3 7"/>
    <circle class="spin-r" cx="900" cy="150" r="42" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1" stroke-dasharray="1 9"/>

    <g fill="#0b0f14" stroke-width="2">
      <circle cx="790" cy="150" r="6" stroke="#67e8f9"/>
      <circle class="pulse d1" cx="990" cy="72" r="9" stroke="#34d399"/>
      <circle class="pulse d2" cx="1090" cy="116" r="9" stroke="#34d399"/>
      <circle class="pulse d3" cx="990" cy="228" r="8" stroke="#a78bfa"/>
      <circle class="pulse d4" cx="1090" cy="184" r="8" stroke="#a78bfa"/>
      <circle cx="1150" cy="150" r="6" stroke="#f5b942"/>
      <circle cx="900" cy="150" r="13" stroke="#f5b942"/>
    </g>
    <circle class="pulse" cx="900" cy="150" r="5" fill="#f5b942"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#1f2a37" stroke-width="2"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect x="72" y="76" width="120" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="72" y="140" font-size="46" font-weight="600" fill="#e6edf3" letter-spacing="-0.5">Santiago Montealegre Romero</text>
    <text x="72" y="182" font-size="20" fill="#9aa7b4">Systems Engineering Student <tspan fill="#f5b942">·</tspan> Applied AI</text>
  </g>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15">
    <text x="72" y="228" fill="#6b7785"><tspan fill="#34d399">❯</tspan> llm pipelines <tspan fill="#f5b942">·</tspan> agentic systems <tspan fill="#f5b942">·</tspan> local inference <tspan class="cursor" fill="#34d399">▌</tspan></text>
  </g>
</svg>
